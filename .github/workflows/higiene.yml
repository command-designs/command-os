# Higiene del repositorio: archivos de basura, demasiado grandes y posibles secretos.
# El workflow vive en command-web y es el mismo para todos los repos (ESTANDAR.md § 6).
# Excepciones de tamaño: .github/higiene-permitidos.txt (una ruta por línea).
name: higiene

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: higiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  higiene:
    uses: command-designs/command-web/.github/workflows/higiene.yml@main
