# Command OS — construye, firma y publica en el repositorio público command-designs/command-os-versions:
#   - Release "repo": el paquete command-os (repositorio de pacman), de donde se instalan y
#     actualizan los equipos. Solo si ha cambiado os/: así un cambio que solo toca el instalador no
#     avisa a todos los equipos de una actualización que no cambia nada.
#   - Release "instalador": el instalador firmado (build/x86/empaquetar-instalador.sh), el script
#     que lo descarga y comprueba (build/x86/instalar-command-os.sh) y la clave pública. Siempre.
#   - En la misma Release "repo", después: command-os-hyprbars (os/hyprbars), compilado contra el Arch de
#     la fecha validada, si cambia su paquete o la fecha (un plugin solo carga en el Hyprland y las
#     bibliotecas con que se compiló).
#
# Necesita dos secretos en este repositorio (Settings → Secrets and variables → Actions):
#   COMMAND_OS_GPG_KEY     clave privada de firma (ASCII armor). La pública está en
#                          os/pacman/command-os.gpg y los equipos solo aceptan lo firmado con ella.
#   COMMAND_OS_VERSIONS_TOKEN  token con permiso de escritura (Contents: Read and write) en
#                          command-designs/command-os-versions.
name: publicar

on:
  push:
    branches: [main]
    paths: ['os/**', 'build/x86/**']
  workflow_dispatch:
  workflow_call:
    secrets:
      COMMAND_OS_GPG_KEY:
        required: true
      COMMAND_OS_VERSIONS_TOKEN:
        required: true

concurrency:
  group: publicar
  cancel-in-progress: false  # no cortar una publicación a medias

env:
  REPO_PUBLICO: command-designs/command-os-versions

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: archlinux:latest
    outputs:
      hyprbars: ${{ steps.cambios.outputs.hyprbars }}
    steps:
      # git antes del checkout: sin él, actions/checkout baja los archivos sin el historial y no hay
      # git archive (empaquetar-instalador.sh) ni comparación con el commit anterior.
      - name: Herramientas
        run: pacman -Syu --noconfirm base-devel git github-cli gnupg

      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Repositorio de git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Qué ha cambiado
        id: cambios
        run: |
          # Un push que no toca os/ (solo el instalador) no publica paquete nuevo; uno que solo toca
          # os/hyprbars, solo el plugin. A mano (workflow_dispatch), desde otro workflow (fecha.yml) o si
          # no se sabe el commit anterior, los dos.
          antes="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = push ] && [ -n "$antes" ] \
            && git cat-file -e "$antes^{commit}" 2>/dev/null; then
            if git diff --quiet "$antes" HEAD -- os ':!os/hyprbars'; then
              echo "paquete=no" >> "$GITHUB_OUTPUT"
              echo "os/ no ha cambiado: no se publica el paquete command-os"
            else
              echo "paquete=si" >> "$GITHUB_OUTPUT"
            fi
            if git diff --quiet "$antes" HEAD -- os/hyprbars os/pacman/snapshot-date; then
              echo "hyprbars=no" >> "$GITHUB_OUTPUT"
            else
              echo "hyprbars=si" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "paquete=si" >> "$GITHUB_OUTPUT"
            echo "hyprbars=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Clave de firma
        env:
          CLAVE: ${{ secrets.COMMAND_OS_GPG_KEY }}
        run: |
          if [ -z "$CLAVE" ]; then echo "::error::Falta el secreto COMMAND_OS_GPG_KEY"; exit 1; fi
          printf '%s\n' "$CLAVE" | gpg --batch --import
          huella=$(tr -d '[:space:]' < os/pacman/command-os.fingerprint)
          gpg --batch --list-secret-keys "$huella" >/dev/null \
            || { echo "::error::La clave del secreto no es la de os/pacman/command-os.fingerprint"; exit 1; }
          echo "GPGKEY=$huella" >> "$GITHUB_ENV"

      - name: Paquete
        if: steps.cambios.outputs.paquete == 'si'
        run: |
          useradd -m constructor
          cp -r os /home/constructor/os
          chown -R constructor: /home/constructor/os
          version="$(date -u +%Y.%m.%d.%H%M)"
          runuser -u constructor -- env COMMAND_OS_PKGVER="$version" \
            bash -c 'cd ~/os/pkg && makepkg -d --noconfirm'
          mkdir repo
          cp /home/constructor/os/pkg/command-os-*.pkg.tar.zst repo/
          cd repo
          for p in command-os-*.pkg.tar.zst; do gpg --batch --yes --detach-sign "$p"; done

      - name: Repositorio
        if: steps.cambios.outputs.paquete == 'si'
        env:
          GH_TOKEN: ${{ secrets.COMMAND_OS_VERSIONS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::Falta el secreto COMMAND_OS_VERSIONS_TOKEN"; exit 1; fi
          cd repo
          gh release view repo -R "$REPO_PUBLICO" >/dev/null 2>&1 || gh release create repo -R "$REPO_PUBLICO" \
            --title "Repositorio de paquetes de Command OS" \
            --notes "Repositorio de pacman de Command OS. Los equipos lo configuran solos (command-os-update)."
          # Base de datos actual (si existe) y nuevo paquete; repo-add firma la base de datos.
          gh release download repo -R "$REPO_PUBLICO" -p 'command-os.db.tar.gz' -p 'command-os.files.tar.gz' || true
          repo-add --sign --key "$GPGKEY" -R command-os.db.tar.gz command-os-*.pkg.tar.zst
          # Los enlaces simbólicos no se pueden subir a una Release: copias con el nombre que busca pacman.
          for f in db files; do
            cp -L "command-os.$f" "command-os.$f.real" && mv "command-os.$f.real" "command-os.$f"
            cp -L "command-os.$f.sig" "command-os.$f.sig.real" && mv "command-os.$f.sig.real" "command-os.$f.sig"
          done
          gh release upload repo -R "$REPO_PUBLICO" --clobber \
            command-os.db command-os.db.sig command-os.db.tar.gz command-os.db.tar.gz.sig \
            command-os.files command-os.files.sig command-os.files.tar.gz command-os.files.tar.gz.sig \
            command-os-*.pkg.tar.zst command-os-*.pkg.tar.zst.sig
          # Fuera las versiones anteriores del paquete (las de command-os, que empiezan por la fecha: no
          # las de command-os-hyprbars).
          nuevo=$(ls command-os-*.pkg.tar.zst)
          gh release view repo -R "$REPO_PUBLICO" --json assets -q '.assets[].name' \
            | grep -E '^command-os-[0-9].*\.pkg\.tar\.zst(\.sig)?$' | grep -vxF -e "$nuevo" -e "$nuevo.sig" \
            | while read -r viejo; do gh release delete-asset repo "$viejo" -R "$REPO_PUBLICO" -y; done
          echo "Publicado: $nuevo"

      - name: Instalador
        env:
          GH_TOKEN: ${{ secrets.COMMAND_OS_VERSIONS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::Falta el secreto COMMAND_OS_VERSIONS_TOKEN"; exit 1; fi
          # La versión del paquete que está publicado ahora (el de este paso o el anterior).
          version=$(gh release view repo -R "$REPO_PUBLICO" --json assets -q '.assets[].name' \
            | sed -nE 's/^command-os-(.+)-[0-9]+-any\.pkg\.tar\.zst$/\1/p' | head -1)
          [ -n "$version" ] || { echo "::error::No hay ningún paquete publicado en la Release repo"; exit 1; }
          mkdir instalador
          bash build/x86/empaquetar-instalador.sh instalador/command-os-instalador.tar.gz "$version"
          gpg --batch --yes --detach-sign instalador/command-os-instalador.tar.gz
          cp build/x86/instalar-command-os.sh os/pacman/command-os.gpg instalador/
          gpg --batch --yes --detach-sign instalador/instalar-command-os.sh
          gh release view instalador -R "$REPO_PUBLICO" >/dev/null 2>&1 || gh release create instalador \
            -R "$REPO_PUBLICO" --title "Instalador de Command OS" \
            --notes "Desde el USB en vivo de Arch Linux: descarga instalar-command-os.sh y ejecútalo con bash. Comprueba la firma del instalador antes de ejecutarlo."
          gh release upload instalador -R "$REPO_PUBLICO" --clobber instalador/*
          echo "Instalador publicado (paquete $version)"

  # El plugin de las barras de título de Hyprland, después del paquete (los dos tocan la base de datos del
  # repositorio). Contra el Arch de la fecha validada, el que tienen los equipos, no el del día.
  hyprbars:
    needs: publicar
    if: needs.publicar.outputs.hyprbars == 'si'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Arch de la fecha validada
        run: |
          fecha=$(grep -oE '^[0-9]{4}/[0-9]{2}/[0-9]{2}' os/pacman/snapshot-date)
          echo "Server = https://archive.archlinux.org/repos/$fecha/\$repo/os/\$arch" > /etc/pacman.d/mirrorlist
          echo "Arch: $fecha"
          # -uu: la imagen de Docker es más nueva que la fecha; el plugin se compila con lo de la fecha.
          for i in 1 2 3 4; do
            pacman -Syuu --noconfirm base-devel github-cli gnupg hyprland && break
            [ "$i" = 4 ] && exit 1
            echo "pacman falló (intento $i), reintento"; sleep 20
          done

      - name: Clave de firma
        env:
          CLAVE: ${{ secrets.COMMAND_OS_GPG_KEY }}
        run: |
          if [ -z "$CLAVE" ]; then echo "::error::Falta el secreto COMMAND_OS_GPG_KEY"; exit 1; fi
          printf '%s\n' "$CLAVE" | gpg --batch --import
          huella=$(tr -d '[:space:]' < os/pacman/command-os.fingerprint)
          gpg --batch --list-secret-keys "$huella" >/dev/null \
            || { echo "::error::La clave del secreto no es la de os/pacman/command-os.fingerprint"; exit 1; }
          echo "GPGKEY=$huella" >> "$GITHUB_ENV"

      - name: Paquete
        run: |
          useradd -m constructor
          cp -r os/hyprbars /home/constructor/hyprbars
          chown -R constructor: /home/constructor/hyprbars
          # pkgrel con la fecha y hora: cada publicación es más nueva que la anterior para pacman.
          runuser -u constructor -- env COMMAND_OS_PKGREL="$(date -u +%Y%m%d%H%M)" \
            bash -c 'cd ~/hyprbars && makepkg -d --noconfirm'
          # Lo mismo que en las pruebas: es para el Hyprland de la fecha y su configuración vale.
          bash tests/hyprbars.sh /home/constructor/hyprbars/src/hyprland-plugins-*/hyprbars/hyprbars.so
          mkdir repo
          cp /home/constructor/hyprbars/command-os-hyprbars-*.pkg.tar.zst repo/
          cd repo
          for p in command-os-hyprbars-*.pkg.tar.zst; do gpg --batch --yes --detach-sign "$p"; done

      - name: Repositorio
        env:
          GH_TOKEN: ${{ secrets.COMMAND_OS_VERSIONS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::Falta el secreto COMMAND_OS_VERSIONS_TOKEN"; exit 1; fi
          cd repo
          gh release download repo -R "$REPO_PUBLICO" -p 'command-os.db.tar.gz' -p 'command-os.files.tar.gz'
          repo-add --sign --key "$GPGKEY" -R command-os.db.tar.gz command-os-hyprbars-*.pkg.tar.zst
          # Los enlaces simbólicos no se pueden subir a una Release: copias con el nombre que busca pacman.
          for f in db files; do
            cp -L "command-os.$f" "command-os.$f.real" && mv "command-os.$f.real" "command-os.$f"
            cp -L "command-os.$f.sig" "command-os.$f.sig.real" && mv "command-os.$f.sig.real" "command-os.$f.sig"
          done
          gh release upload repo -R "$REPO_PUBLICO" --clobber \
            command-os.db command-os.db.sig command-os.db.tar.gz command-os.db.tar.gz.sig \
            command-os.files command-os.files.sig command-os.files.tar.gz command-os.files.tar.gz.sig \
            command-os-hyprbars-*.pkg.tar.zst command-os-hyprbars-*.pkg.tar.zst.sig
          # Fuera las versiones anteriores del plugin.
          nuevo=$(ls command-os-hyprbars-*.pkg.tar.zst)
          gh release view repo -R "$REPO_PUBLICO" --json assets -q '.assets[].name' \
            | grep -E '^command-os-hyprbars-.*\.pkg\.tar\.zst(\.sig)?$' | grep -vxF -e "$nuevo" -e "$nuevo.sig" \
            | while read -r viejo; do gh release delete-asset repo "$viejo" -R "$REPO_PUBLICO" -y; done
          echo "Publicado: $nuevo"
