# Command OS — valida una fecha nueva de Arch para los equipos x86_64 (os/pacman/snapshot-date).
# 1. Prueba el escritorio con el Arch de esa fecha.
# 2. Si pasa, guarda la fecha en main y publica el paquete: los equipos la reciben con la siguiente
#    actualización (command-os-update). Si falla, no cambia nada.
# Se lanza a mano (Actions → fecha → Run workflow), p. ej. cada semana o tras un aviso de pruebas.yml.
name: fecha

on:
  workflow_dispatch:
    inputs:
      fecha:
        description: Fecha del Arch Linux Archive (AAAA/MM/DD); vacío = ayer
        type: string
        default: ''

permissions:
  contents: write

jobs:
  elegir:
    runs-on: ubuntu-latest
    outputs:
      fecha: ${{ steps.f.outputs.fecha }}
    steps:
      - id: f
        run: |
          f="${{ inputs.fecha }}"
          [ -n "$f" ] || f=$(date -u -d yesterday +%Y/%m/%d)
          echo "$f" | grep -qE '^[0-9]{4}/[0-9]{2}/[0-9]{2}$' || { echo "::error::Fecha no válida: $f"; exit 1; }
          echo "fecha=$f" >> "$GITHUB_OUTPUT"

  probar:
    needs: elegir
    uses: ./.github/workflows/escritorio.yml
    with:
      arch: ${{ needs.elegir.outputs.fecha }}
      ref: main

  validar:
    needs: [elegir, probar]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Guardar la fecha en main
        run: |
          echo "${{ needs.elegir.outputs.fecha }}" > os/pacman/snapshot-date
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add os/pacman/snapshot-date
          git commit -m "Validate Arch snapshot ${{ needs.elegir.outputs.fecha }}" || echo "La fecha ya era esa"
          git push origin HEAD:main

  publicar:
    needs: validar
    uses: ./.github/workflows/publicar.yml
    secrets: inherit
