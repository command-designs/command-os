# Command OS — pruebas en cada cambio y cada día.
#   - scripts: sintaxis y errores graves (shellcheck) de todos los scripts.
#   - marca: ningún archivo de tema usa un color fuera de la paleta v2 ni brillos (tests/marca.sh).
#   - pantallas: la escala de alta densidad y la configuración de hyprlock escalada (tests/pantallas.sh).
#   - barra: la batería con una batería simulada, sus avisos, el límite de carga y las aplicaciones
#     fijadas (tests/barra.sh).
#   - aplicaciones: qué se hace con cada descarga, las asociaciones de tipos, la orden de la tienda y el
#     tema GTK que leen las apps Flatpak (tests/aplicaciones.sh).
#   - instalador publicado: lo que lleva y que solo se ejecuta con una firma buena (tests/instalador.sh).
#   - discos: el instalador en disco entero rechaza lo que no debe borrar (tests/discos.sh).
#   - rollback: command-os-rollback sobre un btrfs en un disco loop, con y sin /boot aparte y con un
#     fallo a medias que debe deshacerlo todo (tests/rollback.sh).
#   - escritorio con el Arch de la fecha validada: lo que tienen los equipos.
#   - escritorio con el Arch del día: avisa antes de que una actualización de Arch rompa algo; si
#     falla, no se valida una fecha nueva hasta arreglarlo (docs/actualizaciones.md).
#     Si falla en la ejecución diaria, abre un issue (y lo cierra cuando vuelve a pasar).
name: pruebas

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

concurrency:
  group: pruebas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Sintaxis
        run: |
          for f in os/install.sh os/lib/* os/bin/* os/initcpio/*/* os/system/sleep-* os/pkg/PKGBUILD build/x86/*.sh tests/*.sh; do
            case "$f" in *.py) python3 -c "import ast, sys; ast.parse(open(sys.argv[1]).read())" "$f" || exit 1 ;; *) bash -n "$f" || exit 1 ;; esac
          done
      - name: shellcheck (solo errores)
        run: |
          shellcheck -S error -e SC1090,SC1091 os/install.sh $(find os/lib -maxdepth 1 -type f ! -name '*.py') os/bin/* os/initcpio/*/* os/system/sleep-* build/x86/*.sh tests/*.sh
      - name: Colores de la marca v2
        run: bash tests/marca.sh
      - name: Escala de las pantallas
        run: bash tests/pantallas.sh
      - name: Batería y aplicaciones fijadas de la barra
        run: bash tests/barra.sh
      - name: Instalar aplicaciones (descargas, tipos de archivo, tienda, tema de las apps Flatpak)
        run: bash tests/aplicaciones.sh
      - name: Instalador publicado (contenido y firma)
        run: |
          # msgfmt compila el catálogo del instalador en inglés (cargar_idioma); Ubuntu solo trae gettext-base.
          command -v msgfmt >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq gettext; }
          sudo git config --global --add safe.directory "$PWD"
          sudo bash tests/instalador.sh

  # Seguridad del instalador en disco entero, con discos loop (nunca discos reales del ejecutor).
  discos:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Herramientas
        # gettext: msgfmt, para las confirmaciones en inglés (cargar_idioma compila os/po/en.po).
        run: sudo apt-get update -q && sudo apt-get install -yq gdisk dosfstools ntfs-3g cryptsetup-bin busybox gettext
      - name: Qué discos rechaza, confirmación, particionado y cifrado
        run: sudo bash tests/discos.sh

  # command-os-rollback sobre un btrfs en un disco loop (nunca discos reales del ejecutor).
  rollback:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Herramientas
        # busybox-static: el chroot de la prueba lleva su propio sh (restore_kernel).
        run: sudo apt-get update -q && sudo apt-get install -yq btrfs-progs busybox-static
      - name: Volver a una instantánea, kernel en /boot, deshacer si falla y subvolúmenes del instalador
        run: |
          sudo modprobe btrfs || true
          sudo bash tests/rollback.sh

  escritorio-validada:
    uses: ./.github/workflows/escritorio.yml
    with:
      arch: validada

  escritorio-hoy:
    uses: ./.github/workflows/escritorio.yml
    with:
      arch: hoy

  # Solo en la ejecución diaria: si el Arch del día falla, abre un issue (o añade un comentario al que
  # ya esté abierto) y, cuando vuelve a ir bien, lo cierra. Dura segundos: casi no gasta minutos.
  avisar-fallo:
    if: always() && github.event_name == 'schedule'
    needs: [escritorio-hoy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITULO: 'CI programada: falla el escritorio con el Arch del día'
      EJECUCION: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Abrir, actualizar o cerrar el issue
        run: |
          num=$(gh issue list --state open --search "$TITULO in:title" --json number,title \
            --jq "map(select(.title == \"$TITULO\")) | .[0].number // empty")
          if [ "${{ needs.escritorio-hoy.result }}" = failure ]; then
            cuerpo="Ha fallado la prueba diaria con el Arch del día: $EJECUCION. Hasta arreglarlo no se valida una fecha nueva (docs/actualizaciones.md)."
            if [ -n "$num" ]; then gh issue comment "$num" --body "$cuerpo"; else gh issue create --title "$TITULO" --body "$cuerpo"; fi
          elif [ -n "$num" ]; then
            gh issue close "$num" --comment "Vuelve a pasar: $EJECUCION."
          fi
