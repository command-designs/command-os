# Command OS — pruebas en cada cambio y cada día.
#   - scripts: sintaxis y errores graves (shellcheck) de todos los scripts.
#   - pantallas: la escala de alta densidad y la configuración de hyprlock escalada (tests/pantallas.sh).
#   - instalador publicado: lo que lleva y que solo se ejecuta con una firma buena (tests/instalador.sh).
#   - discos: el instalador en disco entero rechaza lo que no debe borrar (tests/discos.sh).
#   - rollback: command-os-rollback sobre un btrfs en un disco loop, con y sin /boot aparte y con un
#     fallo a medias que debe deshacerlo todo (tests/rollback.sh).
#   - escritorio con el Arch de la fecha validada: lo que tienen los equipos.
#   - escritorio con el Arch del día: avisa antes de que una actualización de Arch rompa algo; si
#     falla, no se valida una fecha nueva hasta arreglarlo (docs/actualizaciones.md).
name: pruebas

on:
  push:
  pull_request:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sintaxis
        run: |
          for f in os/install.sh os/lib/* os/bin/* os/initcpio/*/* os/pkg/PKGBUILD build/x86/*.sh tests/*.sh; do
            case "$f" in *.py) python3 -c "import ast, sys; ast.parse(open(sys.argv[1]).read())" "$f" || exit 1 ;; *) bash -n "$f" || exit 1 ;; esac
          done
      - name: shellcheck (solo errores)
        run: |
          shellcheck -S error -e SC1090,SC1091 os/install.sh $(find os/lib -maxdepth 1 -type f ! -name '*.py') os/bin/* os/initcpio/*/* build/x86/*.sh tests/*.sh
      - name: Escala de las pantallas
        run: bash tests/pantallas.sh
      - name: Instalador publicado (contenido y firma)
        run: |
          # msgfmt compila el catálogo del instalador en inglés (cargar_idioma); Ubuntu solo trae gettext-base.
          command -v msgfmt >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq gettext; }
          sudo git config --global --add safe.directory "$PWD"
          sudo bash tests/instalador.sh

  # Seguridad del instalador en disco entero, con discos loop (nunca discos reales del ejecutor).
  discos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Herramientas
        # gettext: msgfmt, para las confirmaciones en inglés (cargar_idioma compila os/po/en.po).
        run: sudo apt-get update -q && sudo apt-get install -yq gdisk dosfstools ntfs-3g cryptsetup-bin busybox gettext
      - name: Qué discos rechaza, confirmación, particionado y cifrado
        run: sudo bash tests/discos.sh

  # command-os-rollback sobre un btrfs en un disco loop (nunca discos reales del ejecutor).
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Herramientas
        # busybox-static: el chroot de la prueba lleva su propio sh (restore_kernel).
        run: sudo apt-get update -q && sudo apt-get install -yq btrfs-progs busybox-static
      - name: Volver a una instantánea, kernel en /boot y deshacer si falla
        run: |
          sudo modprobe btrfs || true
          sudo bash tests/rollback.sh

  escritorio-validada:
    uses: ./.github/workflows/escritorio.yml
    with:
      arch: validada

  escritorio-hoy:
    uses: ./.github/workflows/escritorio.yml
    with:
      arch: hoy
