# Command OS — portales de escritorio en la sesión de Hyprland de prueba (XDG_CURRENT_DESKTOP=Hyprland),
# los mismos que en labwc: Hyprland también da los protocolos de wlroots que usa el portal wlr.
# GTK para diálogos de archivo, ajustes y modo oscuro; wlr para capturas y compartir pantalla.
[preferred]
default=gtk
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.ScreenCast=wlr
