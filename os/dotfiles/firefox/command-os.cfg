// Command OS: autoconfiguración de Firefox (la primera línea se salta). La activa
// /usr/lib/firefox/defaults/pref/command-os.js. Pone en toda la interfaz de Firefox la hoja con la
// marca (/usr/share/command-os/firefox/command.css). Si falla, Firefox sigue con su tema.
try {
  const sss = Components.classes["@mozilla.org/content/style-sheet-service;1"]
    .getService(Components.interfaces.nsIStyleSheetService);
  const hoja = Services.io.newURI("file:///usr/share/command-os/firefox/command.css");
  if (!sss.sheetRegistered(hoja, sss.USER_SHEET)) {
    sss.loadAndRegisterSheet(hoja, sss.USER_SHEET);
  }
} catch (e) {
  Components.utils.reportError(e);
}
