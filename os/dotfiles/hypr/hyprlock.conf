# Bloqueo de Command OS: terminal HUD (docs/DISENO.md). Voz de BRAND.md § 2: minúsculas, tono terminal.

general {
    hide_cursor = true
}

background {
    monitor =
    path = /usr/share/command-os/wallpapers/command-void.png
    color = rgb(13, 11, 14)
}

image {
    monitor =
    path = /usr/share/command-os/logo/command-mark-white.png
    size = 72
    rounding = 0
    border_size = 0
    position = 0, 200
    halign = center
    valign = center
}

# Hora con un halo rojo suave.
label {
    monitor =
    text = cmd[update:60000] date +"%H:%M"
    color = rgb(237, 235, 230)
    font_size = 64
    font_family = Oxanium SemiBold
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(209, 52, 73, 0.4)
    position = 0, 90
    halign = center
    valign = center
}

label {
    monitor =
    text = › sesión bloqueada
    color = rgb(209, 52, 73)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, 24
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 44
    outline_thickness = 1
    rounding = 0
    dots_size = 0.25
    dots_spacing = 0.4
    dots_center = true
    inner_color = rgb(21, 18, 26)
    outer_color = rgba(209, 52, 73, 0.6)
    check_color = rgb(91, 191, 196)
    fail_color = rgb(226, 192, 68)
    font_color = rgb(237, 235, 230)
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = false
    placeholder_text = <span foreground="##6f6870">contraseña</span>
    fail_text = acceso denegado
    position = 0, -50
    halign = center
    valign = center
}

# Línea de estado tipo HUD, arriba (abajo está el wordmark del fondo).
label {
    monitor =
    text = cmd[update:60000] echo "cmd-os  //  $(cat /etc/hostname)  //  $(date +'%d.%m.%Y')"
    color = rgb(47, 110, 114)
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = 0, -40
    halign = center
    valign = top
}
