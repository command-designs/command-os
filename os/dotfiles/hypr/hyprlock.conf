# Estado del aparato: batería, red y usuario@equipo (command-os-status), arriba.
label {
    monitor =
    text = cmd[update:30000] command-os-status --pango
    color = rgb(133, 130, 124)
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = 0, -40
    halign = center
    valign = top
}

