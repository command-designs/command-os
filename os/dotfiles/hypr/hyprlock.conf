# Bloqueo de Command OS: marca v2 (docs/DISENO.md). Voz de BRAND.md § 2: minúsculas, tono terminal.

general {
    hide_cursor = true
    # Bloquea al instante: sin esto espera hasta 2 s a cargar el fondo y los textos con comandos
    # (la línea de estado consulta NetworkManager). Mientras tanto se ve Void, el color del fondo.
    immediate_render = true
    # Pulsar Intro sin escribir nada no cuenta como intento fallido.
    ignore_empty_input = true
}

# Movimiento de Command: entra con un fundido seco y sale rápido; el campo cambia de color con la
# misma curva (comprobando en Ash, error en Warn).
animations {
    enabled = true
    bezier = out, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 4, out
    animation = fadeOut, 1, 2, out
    animation = inputFieldColors, 1, 2, out
    animation = inputFieldDots, 1, 1.5, out
}

background {
    monitor =
    path = /usr/share/command-os/wallpapers/command-void.png
    color = rgb(14, 14, 14)
}

image {
    monitor =
    path = /usr/share/command-os/logo/command-mark-white.png
    size = 72
    rounding = 0
    border_size = 0
    position = 0, 200
    halign = center
    valign = center
}

# Hora, en Oxanium y sin halo (marca v2: el halo, solo en la barra del logo).
label {
    monitor =
    text = cmd[update:60000] date +"%H:%M"
    color = rgb(237, 235, 230)
    font_size = 64
    font_family = Oxanium SemiBold
    position = 0, 90
    halign = center
    valign = center
}

label {
    monitor =
    text = <span text_transform="uppercase" font_weight="500" letter_spacing="1700">{{sesión bloqueada}}</span>
    color = rgb(245, 72, 44)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 0, 24
    halign = center
    valign = center
}

# Contraseña. Avisa de las mayúsculas activadas (Warn) y cuenta los intentos fallidos.
input-field {
    monitor =
    size = 300, 44
    outline_thickness = 1
    rounding = 0
    dots_size = 0.25
    dots_spacing = 0.4
    dots_center = true
    inner_color = rgb(21, 21, 21)
    outer_color = rgb(245, 72, 44)
    check_color = rgb(163, 160, 154)
    fail_color = rgb(255, 176, 32)
    capslock_color = rgb(255, 176, 32)
    font_color = rgb(237, 235, 230)
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = false
    placeholder_text = <span foreground="##85827c">{{contraseña}}</span>
    fail_text = <span text_transform="uppercase" font_weight="500" letter_spacing="1434">{{acceso denegado}} · $ATTEMPTS</span>
    position = 0, -50
    halign = center
    valign = center
}

# Escuadras (marca v2, BRAND § 6): enmarcan la zona principal, de la hora al campo (380 × 242 px,
# centrada 29 px por encima del centro). Brazos de 10 px y 1 px de grueso en Red Hot. hyprlock no
