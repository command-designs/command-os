# Bloqueo de Command OS. Voz de BRAND.md § 2: minúsculas, tono terminal.

general {
    hide_cursor = true
}

background {
    monitor =
    path = /usr/share/command-os/wallpapers/command-void.png
    color = rgb(14, 14, 14)
}

image {
    monitor =
    path = /usr/share/command-os/logo/command-mark-white.png
    size = 72
    position = 0, 190
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%H:%M"
    color = rgb(237, 235, 230)
    font_size = 64
    font_family = Oxanium SemiBold
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = › bloqueado
    color = rgb(163, 160, 154)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, 20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 44
    outline_thickness = 1
    rounding = 4
    dots_size = 0.25
    dots_spacing = 0.4
    inner_color = rgb(21, 21, 21)
    outer_color = rgb(42, 42, 42)
    check_color = rgb(237, 235, 230)
    fail_color = rgb(245, 72, 44)
    font_color = rgb(237, 235, 230)
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = false
    placeholder_text = contraseña
    fail_text = incorrecta
    position = 0, -50
    halign = center
    valign = center
}
