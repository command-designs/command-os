# Command OS — inactividad (hypridle, protocolo ext-idle-notify; funciona en labwc).
# La pantalla se apaga y enciende con wlopm (protocolo wlr-output-power-management).
general {
    # El sonido suena a la vez (&): bloquear no espera a que termine. command-os-lock tiene
    # bloqueos de reserva por si una actualización rompe hyprlock.
    lock_cmd = pidof hyprlock swaylock || (command-os-sound lock & command-os-lock && command-os-sound unlock)
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = wlopm --on '*'
}

# Bloquea a los 5 min, apaga la pantalla a los 10.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600
    on-timeout = wlopm --off '*'
    on-resume = wlopm --on '*'
}
