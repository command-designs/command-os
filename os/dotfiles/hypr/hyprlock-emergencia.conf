# Bloqueo de emergencia de Command OS (command-os-lock): solo si la configuración normal de
# hyprlock falla, p. ej. porque una actualización cambió su formato. Usa únicamente las opciones más
# básicas y estables: fondo liso, una línea de texto y el campo de contraseña.

background {
    monitor =
    color = rgb(13, 11, 14)
}

label {
    monitor =
    text = › {{sesión bloqueada}}
    color = rgb(209, 52, 73)
    font_size = 14
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 44
    outline_thickness = 1
    rounding = 0
    inner_color = rgb(21, 18, 26)
    outer_color = rgb(209, 52, 73)
    font_color = rgb(237, 235, 230)
    fade_on_empty = false
    placeholder_text = {{contraseña}}
    position = 0, -20
    halign = center
    valign = center
}
