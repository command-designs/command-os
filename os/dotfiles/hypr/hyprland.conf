# Command OS — Hyprland. Paleta y tipografía: BRAND.md de command-web (§ 4, § 5).
# Void #0E0E0E · Steel #2A2A2A · Bone #EDEBE6 · Signal Red #A51500 · Red Hot #F5482C
# El rojo es una señal: solo el borde de la ventana activa.

monitor=,preferred,auto,1

$terminal = kitty
$launcher = wofi --show drun
$files    = thunar
$browser  = firefox
$mainMod  = SUPER

exec-once = hyprpaper
exec-once = waybar
exec-once = mako
exec-once = hypridle
exec-once = swayosd-server
exec-once = command-os-sound boot
exec-once = wl-paste --watch cliphist store
exec-once = systemctl --user start hyprpolkitagent

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

general {
    gaps_in = 3
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(f5482cff)
    col.inactive_border = rgba(2a2a2aff)
    layout = dwindle
}

decoration {
    rounding = 4
    dim_inactive = true
    dim_strength = 0.1
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

# Movimiento de BRAND.md § 9: arranca con decisión, se asienta sin rebotes.
# Curvas: `out` (expo, entrada), `emphasized` (salida rápida), `soft` (fundidos).
# Los valores de velocidad son décimas de segundo (4 = 0,4 s).
animations {
    enabled = true
    bezier = out, 0.16, 1, 0.3, 1
    bezier = emphasized, 0.2, 0, 0, 1
    bezier = soft, 0.4, 0, 0.2, 1
    bezier = linear, 0, 0, 1, 1

    animation = windowsIn, 1, 4, out, popin 90%
    animation = windowsOut, 1, 3, emphasized, popin 90%
    animation = windowsMove, 1, 4, out
    animation = fadeIn, 1, 4, soft
    animation = fadeOut, 1, 3, soft
    animation = fadeSwitch, 1, 4, soft
    animation = fadeDim, 1, 5, soft
    animation = border, 1, 6, soft
    animation = layersIn, 1, 4, out, slide top
    animation = layersOut, 1, 3, emphasized, slide top
    animation = fadeLayersIn, 1, 4, soft
    animation = fadeLayersOut, 1, 3, soft
    animation = workspacesIn, 1, 5, out, slide
    animation = workspacesOut, 1, 4, emphasized, slide
    animation = specialWorkspace, 1, 5, out, slidevert
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = rgb(0e0e0e)
}

# --- Aplicaciones ---
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Space, exec, $launcher
bind = $mainMod, D, exec, $launcher
bind = $mainMod, E, exec, $files
bind = $mainMod, B, exec, $browser
bind = $mainMod, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# --- Ventanas ---
bind = $mainMod, Q, killactive
bind = $mainMod, W, killactive
bind = $mainMod, T, togglefloating
bind = $mainMod, F, fullscreen
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod SHIFT, left, swapwindow, l
bind = $mainMod SHIFT, right, swapwindow, r
bind = $mainMod SHIFT, up, swapwindow, u
bind = $mainMod SHIFT, down, swapwindow, d
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# --- Espacios de trabajo ---
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod, Tab, workspace, e+1
bind = $mainMod SHIFT, Tab, workspace, e-1

# --- Sistema ---
bind = $mainMod, L, exec, loginctl lock-session
bind = $mainMod SHIFT, M, exit
bind = $mainMod, N, exec, makoctl dismiss --all
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, Print, exec, grim - | wl-copy

# --- Teclas multimedia (con OSD) ---
bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise && command-os-sound tick
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower && command-os-sound tick
bindl  = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindel = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPrev, exec, playerctl previous

# Ajustes locales generados por install.sh (p. ej. perfil ligero en VM). Debe ir al final.
source = ~/.config/hypr/local.conf
