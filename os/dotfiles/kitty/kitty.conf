# Command OS — paleta de la marca v2 (docs/DISENO.md). Los colores ANSI salen de la paleta salvo
# azul, magenta y cian, que la marca no tiene: van apagados, casi grises, para que el rojo siga
# siendo la señal (colores extra permitidos en tests/marca.sh).
font_family JetBrainsMono Nerd Font
font_size 11.0
window_padding_width 10
confirm_os_window_close 0
# Escritorio flotante: cada terminal nueva abre con el mismo tamaño (100x30 celdas), sin heredar
# el de la última (que podía quedarse maximizada).
remember_window_size no
initial_window_width 100c
initial_window_height 30c
enable_audio_bell no
cursor_shape block
cursor_blink_interval 0.6

background #0e0e0e
foreground #edebe6
selection_background #3a3a3a
selection_foreground #edebe6
cursor #f5482c
cursor_text_color #0e0e0e
url_color #f5482c
active_border_color #f5482c
inactive_border_color #2a2a2a

color0 #151515
color8 #6e6c68
color1 #f5482c
color9 #f5482c
color2 #3ddc84
color10 #3ddc84
color3 #ffb020
color11 #ffb020
color4 #7d8fa8
color12 #9fadc2
color5 #a88ca0
color13 #c2aabb
color6 #84a3a0
color14 #a6c0bd
color7 #a3a09a
color15 #edebe6
